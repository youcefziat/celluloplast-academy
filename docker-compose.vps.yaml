# Surcouche VPS — publie le dashboard et MinIO derriere le conteneur Caddy existant.
#
# Usage :
#   docker compose -f docker-compose.celluloplast.yaml -f docker-compose.vps.yaml up -d --build
#
# Le fichier de base lie deja tous ses ports a 127.0.0.1 : rien n'est joignable
# depuis Internet. Ce binding est conserve volontairement, il sert au debogage par
# tunnel SSH (ex. Postgres ou MinIO en direct sans passer par Caddy) :
#
#   ssh -L 9000:127.0.0.1:9000 deploy@<vps>
#
# Le service `mailhog` est defini dans le fichier de base mais gate derriere le
# profil compose `mail` (voir docker-compose.celluloplast.yaml) : il ne demarre
# jamais ici tant que le .env du VPS ne definit pas COMPOSE_PROFILES=mail, ce
# qu'il ne doit pas faire. En production, SMTP_HOST/PORT/USER/PASSWORD/SENDER
# dans le .env du VPS pointent vers un vrai relai SMTP (ex. smtp.hostinger.com) —
# voir docs/celluloplast/LOCAL_EMAIL_TESTING.md pour le mapping des variables.
#
# Seul ajout : `dashboard` et `minio` rejoignent le reseau `proxy` (externe, cree
# par la stack cellulo-forecast) pour que Caddy puisse les atteindre par leur nom
# de conteneur. Aucune autre application du VPS n'est touchee.
#
# MinIO doit etre expose publiquement : le navigateur y televerse les videos et
# documents en direct via des URL presignees (voir packages/core/src/config/storage.ts,
# getPresignS3Client). Sans cela, les uploads echouent.
#
# Attention : exposer MinIO expose aussi la politique anonyme du bucket `media`.
# Voir le commentaire de `minio-init` dans docker-compose.celluloplast.yaml — la
# politique accorde s3:GetObject seul, jamais s3:ListBucket, sinon le bucket devient
# enumerable depuis Internet.

services:
  dashboard:
    networks:
      - default
      - proxy

  minio:
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
